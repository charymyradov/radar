name: radar
description: "Offline vehicle counting and speed estimation with on-device YOLO."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  path_provider: ^2.1.6
  path: ^1.9.1
  camera: ^0.12.2
  tflite_flutter: ^0.12.1
  image: ^4.12.0
  fl_chart: ^1.3.0
  pdf: ^3.13.1
  csv: ^8.0.0
  share_plus: ^13.3.1
  permission_handler: ^13.0.2
  flutter_foreground_task: ^11.0.3
  wakelock_plus: ^1.8.2
  archive: ^4.5.2
  uuid: ^4.6.0
  intl: ^0.20.3
  collection: ^1.19.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/models/
    - assets/config/

